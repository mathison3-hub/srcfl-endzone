name: Refresh ESPN data

# Runs the fetch script and commits the updated cache file, so the live
# site always reads a fast static file instead of calling ESPN live on
# every page load.
#
# SETUP REQUIRED: add these as repo secrets before this will work —
# GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   ESPN_LEAGUE_ID = 298919
#   ESPN_SWID      = (your SWID cookie, including the { })
#   ESPN_S2        = (your espn_s2 cookie)
# These are separate from the ones in Vercel's environment variables —
# GitHub Actions and Vercel don't share secrets, so they need to be
# added in both places.

on:
  schedule:
    # Runs at 9am UTC every Tuesday and Friday. Adjust as you like —
    # https://crontab.guru is helpful for changing this.
    - cron: '0 9 * * 2,5'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab anytime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install espn-api

      - name: Fetch ESPN data
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python3 scripts/fetch_espn_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/league-cache.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: refresh ESPN data"
          git push
